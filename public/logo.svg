<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- HighVolt.SYS Logo -->
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FACC15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="#0A0A0A"/>
  
  <!-- 闪电符号 -->
  <path d="M 100 30 L 70 100 L 110 100 L 80 170 L 140 90 L 100 90 Z" 
        fill="url(#logo-gradient)" 
        stroke="#FACC15" 
        stroke-width="2"/>
  
  <!-- 电压波形 -->
  <path d="M 20 150 L 40 150 L 50 140 L 60 160 L 70 140 L 80 150 L 180 150" 
        stroke="#374151" 
        stroke-width="2" 
        fill="none"/>
  
  <!-- 文字 HV -->
  <text x="100" y="195" 
        font-family="monospace" 
        font-size="14" 
        font-weight="bold" 
        fill="#FACC15" 
        text-anchor="middle">HighVolt.SYS</text>
</svg>
